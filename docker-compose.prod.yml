services:
  # ============================================================================
  # 1. DATABASE (PostgreSQL)
  # ============================================================================
  db:
    image: postgres:16-alpine
    container_name: hotel_postgres_prod
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - hotel_network
    restart: always

  # ============================================================================
  # 2. API BACKEND (Django + Daphne)
  # ============================================================================
  web:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: hotel_django_api
    command: python -m daphne -b 0.0.0.0 -p 8000 config.asgi:application
    volumes:
      - ./:/app
      - /app/.venv
      - static_volume:/app/staticfiles
    environment:
      - PATH=/app/.venv/bin:$PATH
      - DB_HOST=db
      - REDIS_HOST=host.docker.internal
      - CELERY_BROKER_URL=redis://host.docker.internal:6379/0
      - CELERY_RESULT_BACKEND=redis://host.docker.internal:6379/1
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - hotel_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  # ============================================================================
  # 3. REVERSE PROXY (Nginx)
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: hotel_nginx
    ports:
      - "80:80"
    volumes:
      - static_volume:/app/staticfiles
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    networks:
      - hotel_network
    restart: always

  # ============================================================================
  # 4. CELERY WORKER
  # ============================================================================
  celery_worker:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: hotel_celery_worker
    command: python -m celery -A config worker --loglevel=info
    volumes:
      - ./:/app
      - /app/.venv
    environment:
      - DB_HOST=db
      - REDIS_HOST=host.docker.internal
      - CELERY_BROKER_URL=redis://host.docker.internal:6379/0
      - CELERY_RESULT_BACKEND=redis://host.docker.internal:6379/1
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - hotel_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  # ============================================================================
  # 5. CELERY BEAT
  # ============================================================================
  celery_beat:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: hotel_celery_beat
    command: python -m celery -A config beat --loglevel=info
    volumes:
      - ./:/app
      - /app/.venv
    environment:
      - PATH=/app/.venv/bin:$PATH
      - DB_HOST=db
      - REDIS_HOST=host.docker.internal
      - CELERY_BROKER_URL=redis://host.docker.internal:6379/0
      - CELERY_RESULT_BACKEND=redis://host.docker.internal:6379/1
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - hotel_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

# ============================================================================
# 6. VOLUMES AND GLOBAL NETWORKS
# ============================================================================

volumes:
  postgres_data:
  static_volume:

networks:
  hotel_network:
    driver: bridge