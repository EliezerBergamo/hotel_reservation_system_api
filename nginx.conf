; Upstream configuration pointing to the Daphne web container on port 8000
upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name localhost;

    ; Serve static assets directly from shared volume with cache headers
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    ; Proxy all API and application traffic to Daphne upstream
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}